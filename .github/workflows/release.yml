name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # semver tags only: v0.1.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-publish

jobs:
  verify-version:
    name: Verify tag matches build.zig.zon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Compare tag to package version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          tag="${tag#v}"
          zon_version=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon)
          if [[ "$tag" != "$zon_version" ]]; then
            echo "Tag v$tag does not match build.zig.zon version $zon_version" >&2
            exit 1
          fi

  build:
    name: Build / ${{ matrix.artifact }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # `zigflags` is empty for a native build. Cross-compiling needs zig's own
      # libc, which means no system headers — fine for Windows, where the SDK
      # libraries are stubbed in zig, and impossible for the other two: the
      # Linux build needs X11/GL headers from apt and the macOS build needs the
      # frameworks from Xcode, so each of those builds on its own runner.
      matrix:
        include:
          - os: ubuntu-24.04               # pinned: sets the glibc floor the notes promise
            artifact: zigesis-x86_64-linux
            bin: zigesis
            zigflags: ""
          - os: ubuntu-latest              # cross-compiled: no Windows runner needed
            artifact: zigesis-x86_64-windows
            bin: zigesis.exe
            zigflags: "-Dtarget=x86_64-windows-gnu"
          - os: macos-latest               # Apple Silicon
            artifact: zigesis-aarch64-macos
            bin: zigesis
            zigflags: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Install raylib build dependencies
        if: matrix.artifact == 'zigesis-x86_64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libasound2-dev

      - name: Build
        run: zig build ${{ matrix.zigflags }} -Doptimize=ReleaseSafe

      # Release assets carry no file mode, so the unix binaries ship in a
      # tarball that keeps the executable bit — a bare download would land
      # unrunnable. Windows has no such bit; zip is what it expects anyway.
      - name: Package artifact
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p dist
          if [[ "$BIN" == *.exe ]]; then
            zip -9 -j "dist/$ARTIFACT.zip" "zig-out/bin/$BIN"
          else
            tar -czf "dist/$ARTIFACT.tar.gz" -C zig-out/bin "$BIN"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
          if-no-files-found: error

      # sbom-action's `path` input is always scanned as a directory source,
      # so it must point at a dir, not the binary file itself.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: ${{ matrix.artifact }}.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}.spdx.json
          path: ${{ matrix.artifact }}.spdx.json
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # Required to create the GitHub release
      id-token: write   # Required for cosign keyless (OIDC) signing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
          path: artifacts/

      - name: Verify artifacts
        run: ls -lh artifacts/

      # Globbed by prefix, not `*`: the shell would otherwise expand the
      # freshly-truncated checksums.txt into its own checksum list.
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum zigesis-* > checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via GitHub OIDC — no key material to manage or leak.
      # Verify with: cosign verify-blob --bundle checksums.txt.bundle
      #   --certificate-identity-regexp '...'
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign checksums with cosign
        working-directory: artifacts
        run: |
          cosign sign-blob --yes \
            --bundle checksums.txt.bundle \
            checksums.txt

      # Uses the built-in gh CLI — no third-party action required.
      # --generate-notes auto-populates the release body from PR/commit history.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # github.ref_name is the branch, not a tag, on workflow_dispatch.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ### Downloads

          | Platform | Asset |
          | --- | --- |
          | Linux x86_64 | `zigesis-x86_64-linux.tar.gz` |
          | Windows x86_64 | `zigesis-x86_64-windows.zip` |
          | macOS Apple Silicon | `zigesis-aarch64-macos.tar.gz` |

          Verify before running:

          ```
          sha256sum --ignore-missing -c checksums.txt
          cosign verify-blob --bundle checksums.txt.bundle \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          ```

          The macOS build is unsigned: `xattr -d com.apple.quarantine zigesis`
          after unpacking. The Linux build links libX11/libGL from the system
          and needs glibc 2.39 or newer (Ubuntu 24.04+).
          EOF
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            artifacts/*
